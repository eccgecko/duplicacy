name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'

      - name: Tidy dependencies
        run: go mod tidy
      
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w" -o duplicacy_${{ matrix.goos }}_${{ matrix.goarch }} ./duplicacy
      
      - uses: actions/upload-artifact@v6
        with:
          name: duplicacy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: duplicacy_${{ matrix.goos }}_${{ matrix.goarch }}
